# Push a tag like v0.1.0 and GitHub builds the app and attaches it to a new release.
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: ./release.sh "$GITHUB_REF_NAME"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Document Tool $GITHUB_REF_NAME" \
            --generate-notes
